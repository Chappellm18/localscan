services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localscan
      POSTGRES_USER: localscan
      POSTGRES_PASSWORD: localscan
    ports:
      - "5432:5432"
    volumes:
      - localscan_pg_data:/var/lib/postgresql/data

volumes:
  localscan_pg_data:
